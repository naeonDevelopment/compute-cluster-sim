[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "compute-cluster-sim"
version = "0.2.0"
description = "Bounded synthetic compute-cluster discrete-event reference simulator"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "Theo Georgiev (Naevum)"}]
dependencies = []

[project.scripts]
compute-cluster-sim = "compute_cluster_sim.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
